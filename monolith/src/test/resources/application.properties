spring.datasource.url=jdbc:h2:mem:friendify_monolith_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
jwt.signer-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.issuer=friendify.com
jwt.valid-duration=3600
jwt.refreshable-duration=36000
notification.email.brevo-url=https://api.brevo.com/v3/smtp/email
notification.email.brevo-apikey=
notification.email.sender-name=Friendify
notification.email.sender-email=test@example.com
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
app.oauth2.authorized-redirect-uri=http://localhost:5173/oauth2/success
app.oauth2.cookie-name=FRIENDIFY_ACCESS_TOKEN
app.oauth2.cookie-secure=false
app.oauth2.cookie-same-site=Lax
app.oauth2.cookie-path=/
friendify.seed.enabled=false
