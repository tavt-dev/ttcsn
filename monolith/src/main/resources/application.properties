spring.application.name=monolith
spring.config.import=optional:file:.env[.properties],optional:file:./monolith/.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${FRIENDIFY_DATASOURCE_URL:jdbc:mysql://localhost:3306/friendify_monolith?createDatabaseIfNotExist=true}
spring.datasource.username=${FRIENDIFY_DATASOURCE_USERNAME:root}
spring.datasource.password=${FRIENDIFY_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${FRIENDIFY_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${FRIENDIFY_JPA_SHOW_SQL:true}
jwt.signer-key=${FRIENDIFY_JWT_SIGNER_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
jwt.issuer=${FRIENDIFY_JWT_ISSUER:friendify.com}
jwt.valid-duration=${FRIENDIFY_JWT_VALID_DURATION:3600}
jwt.refreshable-duration=${FRIENDIFY_JWT_REFRESHABLE_DURATION:36000}
notification.email.brevo-url=${BREVO_URL:https://api.brevo.com/v3/smtp/email}
notification.email.brevo-apikey=${BREVO_API_KEY:}
notification.email.sender-name=${BREVO_SENDER_NAME:Friendify}
notification.email.sender-email=${BREVO_SENDER_EMAIL:tavantien786@gmail.com}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:CHANGE_ME_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:CHANGE_ME_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
app.oauth2.authorized-redirect-uri=${FRIENDIFY_OAUTH2_AUTHORIZED_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
friendify.seed.enabled=${FRIENDIFY_SEED_ENABLED:true}
friendify.seed.admin.enabled=${FRIENDIFY_SEED_ADMIN_ENABLED:false}
friendify.seed.admin.username=${FRIENDIFY_SEED_ADMIN_USERNAME:admin}
friendify.seed.admin.password=${FRIENDIFY_SEED_ADMIN_PASSWORD:}
friendify.seed.admin.email=${FRIENDIFY_SEED_ADMIN_EMAIL:admin@friendify.local}
